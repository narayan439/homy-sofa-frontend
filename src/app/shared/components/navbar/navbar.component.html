<mat-toolbar class="navbar">
  
  <!-- Logo on left -->
  <div class="logo-container">
    <a routerLink="/" class="logo">
      Homy Services
    </a>
    <div class="tagline">
      Your complaint our responsibility
    </div>
  </div>

  <span class="spacer"></span>

  <!-- Desktop Menu: Services, About, Contact in middle -->
  <nav class="desktop-menu">
    <a mat-button routerLink="/services" routerLinkActive="active">
      Services
    </a>
    <a mat-button routerLink="/tracking" routerLinkActive="active" *ngIf="!isUserLoggedIn">
      <mat-icon class="menu-icon-small">location_on</mat-icon>
      Track Booking
    </a>
    <a mat-button routerLink="/about" routerLinkActive="active">
      About
    </a>
    <a mat-button routerLink="/contact" routerLinkActive="active" *ngIf="!isUserLoggedIn">
      Contact
    </a>

    <!-- Auth Buttons / User Menu -->
    <div class="auth-section">
      <!-- Unauthorized User: Sign Up / Sign In -->
      <ng-container *ngIf="!isUserLoggedIn">
        <button mat-button color="primary" (click)="goToSignup()" class="signup-btn">
          <mat-icon>person_add</mat-icon>
          Sign Up
        </button>
        <button mat-button color="primary" (click)="goToLogin()" class="signin-btn">
          <mat-icon>login</mat-icon>
          Sign In
        </button>
      </ng-container>

      <!-- Authorized User: Dashboard / Logout -->
      <ng-container *ngIf="isUserLoggedIn">
        <button mat-button color="primary" (click)="goToDashboard()" class="dashboard-btn">
          <mat-icon>dashboard</mat-icon>
          Dashboard
        </button>
        <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-menu-btn">
          <mat-icon>account_circle</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu">
          <div mat-menu-item disabled class="user-info">
            <span class="user-name">{{ currentUserName }}</span>
          </div>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="goToDashboard()">
            <mat-icon>dashboard</mat-icon>
            <span>My Dashboard</span>
          </button>
          <button mat-menu-item (click)="goToEditProfile()">
            <mat-icon>edit</mat-icon>
            <span>Edit Profile</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
          </button>
        </mat-menu>
      </ng-container>
    </div>
  </nav>

  <!-- Mobile Menu Button -->
  <button class="mobile-menu-btn" (click)="toggleMobileSidebar()">
    <span class="menu-icon" [class.open]="mobileSidebarOpen"></span>
  </button>

</mat-toolbar>

<!-- Mobile Sidebar Overlay -->
<div class="mobile-sidebar-overlay" 
     [class.active]="mobileSidebarOpen" 
     (click)="closeMobileSidebar()">
</div>

<!-- Mobile Sidebar -->
<div class="mobile-sidebar" [class.active]="mobileSidebarOpen">
  
  <!-- Sidebar Header -->
  <div class="mobile-sidebar-header">
    <div class="mobile-logo-container">
      <div class="mobile-logo">
        Homy Services
      </div>
      <div class="mobile-tagline">
        Your complaint our responsibility
      </div>
    </div>
    
    <button class="close-sidebar" (click)="closeMobileSidebar()">
      <span class="close-icon"></span>
    </button>
  </div>

  <!-- Sidebar Menu -->
  <ul class="mobile-sidebar-menu">
    <li>
      <a routerLink="/" routerLinkActive="active" (click)="closeMobileSidebar()">
        Home
      </a>
    </li>
    
    <li>
      <a routerLink="/services" routerLinkActive="active" (click)="closeMobileSidebar()">
        Services
      </a>
    </li>
    
    <li>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMobileSidebar()">
        About
      </a>
    </li>
    
    <li *ngIf="!isUserLoggedIn">
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMobileSidebar()">
        Contact
      </a>
    </li>

    <li *ngIf="!isUserLoggedIn">
      <a routerLink="/tracking" routerLinkActive="active" (click)="closeMobileSidebar()">
        <mat-icon class="menu-icon-small">location_on</mat-icon>
        Track Booking
      </a>
    </li>
    <!-- Technician login moved to footer -->
  </ul>

  <!-- Sidebar Footer -->
  <div class="mobile-sidebar-footer">
    <!-- Unauthorized User: Sign Up / Sign In -->
    <ng-container *ngIf="!isUserLoggedIn">
      <button mat-raised-button color="primary" (click)="goToSignup()" class="mobile-auth-btn">
        <mat-icon>person_add</mat-icon>
        Sign Up
      </button>
      <button mat-raised-button color="accent" (click)="goToLogin()" class="mobile-auth-btn">
        <mat-icon>login</mat-icon>
        Sign In
      </button>
    </ng-container>

    <!-- Authorized User: Dashboard / Logout -->
    <ng-container *ngIf="isUserLoggedIn">
      <button mat-button color="primary" (click)="goToDashboard()" class="mobile-dashboard-btn">
        <mat-icon>dashboard</mat-icon>
        Dashboard
      </button>
      <button mat-button color="warn" (click)="logout()" class="mobile-logout-btn">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </ng-container>
  </div>
  
</div>
