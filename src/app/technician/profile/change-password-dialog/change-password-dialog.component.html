<h2 mat-dialog-title>Change Password</h2>

<mat-dialog-content>
  <form [formGroup]="changePasswordForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Old Password</mat-label>
      <input 
        matInput 
        [type]="hideOldPassword ? 'password' : 'text'"
        formControlName="oldPassword"
        placeholder="Enter your current password"
      >
      <button 
        mat-icon-button 
        matSuffix 
        (click)="toggleOldPasswordVisibility()" 
        type="button"
      >
        <mat-icon>{{ hideOldPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="changePasswordForm.get('oldPassword')?.hasError('required')">
        Old password is required
      </mat-error>
      <mat-error *ngIf="changePasswordForm.get('oldPassword')?.hasError('minlength')">
        Password must be at least 4 characters
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>New Password</mat-label>
      <input 
        matInput 
        [type]="hideNewPassword ? 'password' : 'text'"
        formControlName="newPassword"
        placeholder="Enter your new password"
      >
      <button 
        mat-icon-button 
        matSuffix 
        (click)="toggleNewPasswordVisibility()" 
        type="button"
      >
        <mat-icon>{{ hideNewPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="changePasswordForm.get('newPassword')?.hasError('required')">
        New password is required
      </mat-error>
      <mat-error *ngIf="changePasswordForm.get('newPassword')?.hasError('minlength')">
        Password must be at least 4 characters
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Confirm New Password</mat-label>
      <input 
        matInput 
        [type]="hideConfirmPassword ? 'password' : 'text'"
        formControlName="confirmPassword"
        placeholder="Confirm your new password"
      >
      <button 
        mat-icon-button 
        matSuffix 
        (click)="toggleConfirmPasswordVisibility()" 
        type="button"
      >
        <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="changePasswordForm.get('confirmPassword')?.hasError('required')">
        Confirm password is required
      </mat-error>
    </mat-form-field>

    <div *ngIf="showPasswordMismatch" class="error-message">
      <mat-icon>error</mat-icon>
      <span>New passwords do not match</span>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button 
    mat-raised-button 
    color="primary" 
    (click)="onConfirm()"
    [disabled]="changePasswordForm.invalid"
  >
    Change Password
  </button>
</mat-dialog-actions>
